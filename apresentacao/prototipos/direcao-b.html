<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direção B · Fluxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DIREÇÃO B · FLUXO
   Organizada em torno do trabalho em andamento: módulos no topo, páginas e ações do módulo na lateral,
   cartões com hierarquia clara, filas em quadro por situação e a venda como um dossiê com linha do processo.
   ===================================================================== */
:root{
  color-scheme:light;
  --fundo:#eef1f4; --cartao:#ffffff; --cartao-2:#f7f9fb; --cartao-3:#eef2f6;
  --borda:#dde3ea; --borda-2:#c6cfda;
  --texto:#0e1726; --texto-2:#3d4b60; --texto-3:#5f6e84;
  --marca:#c9202e; --marca-2:#a3161f; --marca-bg:#fdeced;
  --ok:#0f7b46; --ok-bg:#e5f4eb; --at:#91560b; --at-bg:#fcf2df; --cr:#b42318; --cr-bg:#fdebe9; --in:#1f5aa6; --in-bg:#e8f0fb;
  --g-real:#2a64ad; --g-proj:#a7c2e6; --g-meta:#0e1726; --g-grade:#e8edf2; --g-eixo:#c6cfda;
  --st-inst:#22975a; --st-pend:#5b86c4; --st-canc:#d0393b;
  /* lateral: o azul-marinho do sistema atual (ui.css --menu-bg), mantido a pedido do cliente */
  --lat:#0c1322; --lat-linha:rgba(255,255,255,.08);
  --lat-tx:#aab4c5; --lat-tx-2:#8794a8; --lat-forte:#ffffff;
  --lat-hov:rgba(255,255,255,.06); --lat-on:rgba(255,255,255,.1); --lat-destaque:#ff6b77;
  --sombra:0 1px 2px rgba(14,23,38,.06),0 2px 8px rgba(14,23,38,.04); --sombra-2:0 18px 48px rgba(14,23,38,.18);
  --raio:12px; --fonte:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --foco:0 0 0 3px color-mix(in srgb,var(--in) 40%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--texto);font:15px/1.5 var(--fonte);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:0;box-shadow:var(--foco);border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------------- topo com os módulos ---------------- */
.topo{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--cartao);border-bottom:1px solid var(--borda)}
.topo .logo{height:26px;display:block}
/* canto do logo na cor da lateral: a coluna azul-marinho vai do topo ao rodapé, como no sistema atual (versão branca do logo) */
.marca-b{align-self:stretch;flex:none;width:256px;margin-left:-24px;padding-left:24px;display:flex;align-items:center;background:var(--lat);border-right:1px solid var(--lat-linha);box-shadow:0 1px 0 var(--lat)}
.marca-b .logo.c,.marca-b .logo.i{display:none}
.modulos{display:flex;align-self:stretch;gap:4px;margin-left:12px;flex:none}
.modulos a{display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:500;color:var(--texto-2);position:relative}
.modulos a:hover{color:var(--texto)}
.modulos a.on{color:var(--texto);font-weight:600}
.modulos a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--marca)}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.pres,.ib,.eu{flex:none}.modulos a,.pres,.eu b,.eu small{white-space:nowrap}
.busca-b span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.busca-b{display:flex;align-items:center;gap:10px;height:38px;flex:0 1 300px;min-width:170px;border:1px solid var(--borda);border-radius:10px;background:var(--cartao-2);padding:0 12px;color:var(--texto-3);font-size:14px;cursor:text}
.busca-b svg{width:17px;height:17px;flex:none}.busca-b kbd{margin-left:auto;flex:none;white-space:nowrap;font:600 11px var(--fonte);border:1px solid var(--borda-2);border-radius:5px;padding:1px 6px}
.pres{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--texto-2);background:var(--cartao-2);cursor:pointer;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--borda)}
.pres .pilha{display:flex}.pres .pilha span{width:26px;height:26px;border-radius:50%;border:2px solid var(--cartao);margin-left:-8px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff}
.pres .pilha span:first-child{margin-left:0}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--borda);background:var(--cartao);display:inline-flex;align-items:center;justify-content:center;color:var(--texto-2);cursor:pointer}
.ib svg{width:18px;height:18px}
.eu{display:flex;align-items:center;gap:10px;padding:3px 4px 3px 3px;border-radius:999px}
.eu .av{width:36px;height:36px;border-radius:50%;background:var(--marca-bg);color:var(--marca-2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.eu b{display:block;font-size:14px;line-height:1.2}.eu small{display:block;font-size:12.5px;color:var(--texto-3);line-height:1.2}

/* ---------------- lateral do módulo ---------------- */
.casca{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100vh - 64px)}
.lateral{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;background:var(--lat);border-right:1px solid var(--lat-linha);padding:20px 14px;display:flex;flex-direction:column;gap:4px;color:var(--lat-tx);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.lateral .mod{padding:0 8px 14px}
.lateral .mod b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--lat-forte)}
.lateral .mod small{display:block;font-size:13px;color:var(--lat-tx-2);line-height:1.4;margin-top:2px}
.lateral .acao{margin:0 4px 14px}
.lateral .grp{font-size:12.5px;font-weight:600;color:var(--lat-tx-2);margin:14px 10px 6px}
.lateral a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--lat-tx);font-size:14.5px;font-weight:500;position:relative}
.lateral a svg{width:19px;height:19px;flex:none;opacity:.78}
.lateral a:hover{background:var(--lat-hov);color:var(--lat-forte)}
.lateral a.on{background:var(--lat-on);color:var(--lat-forte);font-weight:600}
.lateral a.on svg{opacity:1;color:var(--lat-destaque)}
.lateral a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--marca)}
.lateral a .qt{margin-left:auto;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.08);color:var(--lat-tx);border-radius:999px;padding:1px 8px}
.lateral a.on .qt{background:rgba(255,255,255,.14);color:var(--lat-forte)}
.lateral a .qt.quente{background:rgba(224,82,82,.2);color:#ff9c9c}
.lateral :focus-visible{box-shadow:inset 0 0 0 2px var(--lat-forte)}
.lateral .fim{margin-top:auto;padding-top:14px;border-top:1px solid var(--lat-linha)}
.lateral .fim button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;color:var(--lat-tx-2);cursor:pointer;font-size:14px}
.lateral .fim button:hover{background:var(--lat-hov);color:var(--lat-forte)}
.lateral .fim svg{width:18px;height:18px;flex:none}
.lateral .acao{position:relative}
.lateral .menu-novo{display:none;position:absolute;left:0;right:0;top:46px;background:var(--cartao);border:1px solid var(--borda-2);border-radius:10px;box-shadow:var(--sombra-2);padding:6px;z-index:30}
.lateral .acao.aberto .menu-novo{display:block}
.menu-novo a{display:block;padding:9px 10px;border-radius:8px}
.lateral .menu-novo a:hover{background:var(--cartao-3)}
.lateral .menu-novo :focus-visible{box-shadow:var(--foco)}
.menu-novo a b{display:block;font-size:14.5px;color:var(--texto)}
.menu-novo a small{display:block;font-size:12.5px;color:var(--texto-3);line-height:1.35}
.lateral a .bol{display:none}
/* menu recolhido: só existe em tela larga (no celular a lateral é uma gaveta) */
@media (min-width:901px){
  body.recolhido .casca{grid-template-columns:72px minmax(0,1fr)}
  body.recolhido .marca-b{width:72px;padding-left:0;justify-content:center}
  body.recolhido .marca-b .logo.e{display:none}
  body.recolhido .marca-b .logo.i{display:block;width:34px;height:34px;border-radius:8px}
  body.recolhido .lateral{padding:20px 10px}
  body.recolhido .lateral .mod,body.recolhido .lateral .grp,body.recolhido .lateral a span,body.recolhido .lateral a .qt,body.recolhido .lateral .acao .txt,body.recolhido .lateral .fim span{display:none}
  body.recolhido .lateral a{justify-content:center}
  body.recolhido .lateral a.on::before{left:-10px}
  body.recolhido .lateral a .bol{display:block;position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--marca)}
  body.recolhido .lateral .acao .btn{width:44px;padding:0;justify-content:center}
  body.recolhido .lateral .fim button{justify-content:center}
}

.area{padding:26px 32px 72px;min-width:0;max-width:1440px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cab .mig{font-size:13.5px;color:var(--texto-3);margin-bottom:4px}
.cab .mig a:hover{text-decoration:underline}
.cab h1{margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.cab .sub{font-size:14.5px;color:var(--texto-3);margin-top:4px}
.cab .acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------------- botões, campos, pílulas ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--borda-2);background:var(--cartao);font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap;color:var(--texto)}
.btn:hover{background:var(--cartao-2)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff}
.btn.pri:hover{background:var(--marca-2);border-color:var(--marca-2)}
.btn.bloco{width:100%}
.btn.peq{height:32px;padding:0 12px;font-size:13.5px}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--borda-2))}
.btn.cr{color:var(--cr);border-color:color-mix(in srgb,var(--cr) 45%,var(--borda-2))}
.pilula{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--borda);border-radius:999px;background:var(--cartao);font-size:14px;color:var(--texto-2);cursor:pointer;white-space:nowrap}
.pilula b{color:var(--texto);font-weight:600}
.pilula.on{border-color:var(--texto);color:var(--texto)}
.pilula .x{color:var(--texto-3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.at{background:var(--at-bg);color:var(--at)}.chip.cr{background:var(--cr-bg);color:var(--cr)}.chip.in{background:var(--in-bg);color:var(--in)}.chip.nt{background:var(--cartao-3);color:var(--texto-2)}
.chip.at::before{border-radius:1px;transform:rotate(45deg)}
.chip.cr::before{border-radius:0;width:0;height:0;background:none;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:8px solid currentColor}
.chip.in::before{background:none;border:2px solid currentColor;width:5px;height:5px}
.prop{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--in);border:1px dashed var(--in);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:middle;white-space:nowrap;letter-spacing:.01em}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-size:13.5px;font-weight:600;color:var(--texto-2)}
.campo label small{font-weight:400;color:var(--texto-3)}
.campo input,.campo select,.campo textarea{height:40px;border:1px solid var(--borda-2);border-radius:9px;background:var(--cartao);padding:0 12px;font-size:15px}
.campo textarea{height:78px;padding:9px 12px;resize:vertical}

/* ---------------- cartões ---------------- */
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra)}
.cartao>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0}
.cartao>header h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.cartao>header h2 small{display:block;font-size:13.5px;font-weight:400;color:var(--texto-3);margin-top:2px;letter-spacing:0}
.cartao>header a.ver{font-size:14px;font-weight:600;color:var(--in);white-space:nowrap}
.cartao>header a.ver:hover{text-decoration:underline}
.cartao .dentro{padding:16px 20px 20px}
.grade{display:grid;gap:18px;margin-bottom:18px}
.g-3-1{grid-template-columns:minmax(0,2fr) minmax(320px,1fr);align-items:start}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* faixa da meta (destaque do painel) */
.faixa-meta{display:grid;grid-template-columns:1.2fr 1fr 1fr;margin-bottom:18px}
.faixa-meta>div{padding:20px 24px}
.faixa-meta>div+div{border-left:1px solid var(--borda)}
.rot{font-size:14px;font-weight:600;color:var(--texto-2)}
.grande{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:8px 0 6px}
.grande small{font-size:18px;font-weight:600;color:var(--texto-3);letter-spacing:0}
.det{font-size:14px;color:var(--texto-3)}.det b{color:var(--texto-2);font-weight:600}
.medidor{position:relative;height:12px;border-radius:6px;background:var(--cartao-3);margin-top:14px;overflow:visible}
.medidor i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--g-real)}
.medidor u{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--texto)}
.med-leg{display:flex;justify-content:space-between;font-size:12.5px;color:var(--texto-3);margin-top:8px}
.ritmos{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ritmo-l{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:13.5px;color:var(--texto-2)}
.ritmo-l .tr{height:10px;border-radius:5px;background:var(--cartao-3);position:relative}
.ritmo-l .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.ritmo-l b{text-align:right;font-size:15px;color:var(--texto)}

/* indicadores */
.ind{padding:16px 18px}
.ind .r{font-size:13.5px;font-weight:600;color:var(--texto-2);display:flex;align-items:center;gap:8px}
.ind .r i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ind .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:6px 0 2px}
.ind .d{font-size:13.5px;color:var(--texto-3)}

/* gráficos (compartilhados) */
.legenda{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--texto-2);margin:4px 0 6px}
.legenda span{display:inline-flex;align-items:center;gap:8px}
.chv{display:inline-block;width:18px;border-top:2.5px solid var(--g-real)}.chv.proj{border-top:2.5px dashed var(--g-real);opacity:.6}.chv.meta{border-top:1.5px solid var(--g-meta)}
.chv.barra{height:10px;width:14px;border:0;border-radius:3px;background:var(--g-real)}.chv.barra.proj{background:var(--g-proj);opacity:1}.chv.tick{width:3px;height:14px;border:0;border-radius:2px;background:var(--g-meta)}
.g-svg{width:100%;height:auto;display:block;overflow:visible}
.g-grade{stroke:var(--g-grade);stroke-width:1}.g-base{stroke:var(--g-eixo);stroke-width:1}
.g-tick{fill:var(--texto-3);font-size:12px;font-family:var(--fonte)}
.g-meta{stroke:var(--g-meta);stroke-width:1.3}.g-rot-meta{fill:var(--texto);font-size:13px;font-weight:700}
.g-hoje{stroke:var(--borda-2);stroke-width:1}
.g-real{fill:none;stroke:var(--g-real);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g-real-area{fill:var(--g-real);opacity:.1}
.g-proj{fill:none;stroke:var(--g-real);stroke-opacity:.55;stroke-width:2.5;stroke-dasharray:6 6;stroke-linecap:round}
.g-pt-real{fill:var(--g-real);stroke:var(--cartao);stroke-width:2}.g-pt-proj{fill:var(--cartao);stroke:var(--g-real);stroke-width:2}
.g-rot-fim{fill:var(--texto);font-size:13.5px;font-weight:700}
.g-cruz{stroke:var(--texto-3);stroke-width:1}.g-capa{cursor:crosshair}.g-capa:focus{outline:none}
.g-dica{position:fixed;display:none;z-index:60;min-width:200px;background:var(--cartao);border:1px solid var(--borda-2);border-radius:10px;box-shadow:var(--sombra-2);padding:10px 12px;font-size:13.5px;pointer-events:none}
.g-dica-t{font-weight:700;margin-bottom:6px}
.g-dica-l{display:grid;grid-template-columns:16px auto 1fr;gap:8px;align-items:center;color:var(--texto-3);line-height:1.6}
.g-dica-l b{color:var(--texto);font-weight:700;font-variant-numeric:tabular-nums}
.g-chave{display:block;width:14px;border-top:2.5px solid var(--k)}.g-chave.tracejada{border-top-style:dashed}.g-chave.regua{border-top-width:1.5px}.g-chave.fina{opacity:.45}
.g-bullet{position:relative;height:22px;border-radius:6px;background:var(--cartao-3)}
.g-bullet .g-b-proj{position:absolute;left:0;top:5px;bottom:5px;background:var(--g-proj);border-radius:0 6px 6px 0}
.g-bullet .g-b-real{position:absolute;left:0;top:5px;bottom:5px;background:var(--g-real);border-radius:0 6px 6px 0}
.g-bullet .g-b-meta{position:absolute;top:1px;bottom:1px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--g-meta)}
.g-pilha{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin-top:12px}
.g-pilha-p{display:block;min-width:3px}.g-pilha-p.inst{background:var(--st-inst)}.g-pilha-p.pend{background:var(--st-pend)}.g-pilha-p.canc{background:var(--st-canc)}

/* atenção agora */
.alertas{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.alerta{display:block;border:1px solid var(--borda);border-left:4px solid var(--at);border-radius:10px;padding:11px 13px;background:var(--cartao-2)}
.alerta.cr{border-left-color:var(--cr)}
.alerta b{display:block;font-size:14.5px;font-weight:700;line-height:1.35}
.alerta p{margin:3px 0 0;font-size:13.5px;color:var(--texto-2);line-height:1.45}
.alerta .base{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--texto-3)}
.alerta .base a{font-weight:700;color:var(--in);white-space:nowrap}

/* quadro de situação das equipes */
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 20px 20px}
.classe{border-radius:10px;background:var(--cartao-2);border:1px solid var(--borda);padding:12px 14px}
.classe h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.classe ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.classe li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.classe li b{font-weight:600;line-height:1.3}
.classe li span{color:var(--texto-3);font-size:13px;grid-column:1/-1}
.classe li em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}

/* filas da operação */
.fases{display:grid;grid-template-columns:2fr 3fr;gap:18px}
.fase>h3{font-size:13.5px;font-weight:700;color:var(--texto-3);margin:0 0 10px;letter-spacing:.01em}
.fase .tiles{display:grid;gap:12px}
.fase:first-child .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.fase:last-child .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{display:block;padding:14px 16px;border-radius:var(--raio);background:var(--cartao);border:1px solid var(--borda);box-shadow:var(--sombra);position:relative}
.tile:hover{border-color:var(--borda-2)}
.tile .n{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile b{display:block;font-size:15px;margin-top:2px}
.tile small{display:block;font-size:13.5px;color:var(--texto-3);margin-top:4px;line-height:1.4}
.tile .seta{position:absolute;right:14px;top:14px;color:var(--texto-3)}
.tile .quente{color:var(--cr);font-weight:600}

/* tabela em cartão */
.tabela{width:100%;border-collapse:collapse}
.tabela th{font-size:13px;font-weight:600;color:var(--texto-3);text-align:left;padding:11px 16px;border-bottom:1px solid var(--borda);white-space:nowrap;background:var(--cartao-2)}
.tabela td{padding:12px 16px;border-bottom:1px solid var(--borda);vertical-align:middle;font-size:14.5px}
.tabela tbody tr:hover td{background:var(--cartao-2)}
.tabela tbody tr.sel td{background:var(--in-bg)}
.tabela tbody tr{cursor:pointer}
.tabela .sub{display:block;font-size:13px;color:var(--texto-3)}
.tabela .c{font-variant-numeric:tabular-nums;color:var(--texto-2);font-size:14px}
.vend{display:flex;align-items:center;gap:10px}
.vend i{width:28px;height:28px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:var(--texto-2);background:var(--cartao-3)}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tags span{font-size:12.5px;font-weight:600;background:var(--cartao-3);color:var(--texto-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.alerta-txt{color:var(--at);font-weight:600}.atraso-txt{color:var(--cr);font-weight:600}
.visoes{display:flex;gap:4px;border-bottom:1px solid var(--borda);margin-bottom:14px}
.visoes button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--texto-3);cursor:pointer;position:relative;font-size:15px}
.visoes button .q{font-weight:600;color:var(--texto-3);font-size:13px;background:var(--cartao-3);border-radius:999px;padding:0 7px;margin-left:6px}
.visoes button.on{color:var(--texto)}
.visoes button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--marca)}
.barra-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.barra-filtros .buscar{margin-left:auto;width:300px}
.barra-filtros .buscar input{width:100%;height:36px;border:1px solid var(--borda-2);border-radius:999px;padding:0 14px;background:var(--cartao);font-size:14px}
.rodape-tab{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:14px;color:var(--texto-3)}

/* espiada (gaveta lateral) */
.com-gaveta{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.com-gaveta .tabela td:first-child{min-width:210px}
.com-gaveta .tabela td,.com-gaveta .tabela th{padding-left:14px;padding-right:12px}
.gaveta{position:sticky;top:84px}
.gaveta .dentro{display:flex;flex-direction:column;gap:14px}
.gaveta dl{margin:0;display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:14px}
.gaveta dt{color:var(--texto-3)}.gaveta dd{margin:0}
.gaveta .fechar{border:0;background:none;color:var(--texto-3);font-size:22px;cursor:pointer;line-height:1}

/* cartões de equipe */
.equipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.eqc{display:flex;flex-direction:column}
.eqc header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 0}
.eqc h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.eqc header small{display:block;font-size:13.5px;color:var(--texto-3);margin-top:2px}
.eqc .corpo{padding:12px 18px 14px}
.eqc .num-g{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.eqc .num-g small{font-size:15px;font-weight:600;color:var(--texto-3);letter-spacing:0}
.eqc .proj{font-size:14px;color:var(--texto-2);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.eqc .proj b{color:var(--texto)}
.eqc footer{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--borda)}
.eqc footer div{padding:10px 12px 12px 18px;font-size:12.5px;color:var(--texto-3)}
.eqc footer div+div{border-left:1px solid var(--borda);padding-left:12px}
.eqc footer b{display:block;font-size:15px;color:var(--texto);font-weight:700}
.eqc footer b.at{color:var(--at)}.eqc footer b.cr{color:var(--cr)}

/* quadro da fila */
.quadro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.coluna{background:var(--cartao-3);border-radius:var(--raio);padding:12px;min-height:520px}
.coluna h3{margin:2px 4px 12px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.coluna h3 .q{background:var(--cartao);border-radius:999px;padding:0 9px;font-size:13px}
.pedido{display:block;width:100%;text-align:left;background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:12px 13px;margin-bottom:10px;box-shadow:var(--sombra);cursor:pointer}
.pedido.sel{border-color:var(--in);box-shadow:0 0 0 2px var(--in-bg),var(--sombra)}
.pedido .l1{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--texto-3)}
.pedido .idade{font-weight:700;color:var(--texto-2)}
.pedido .idade.fora{color:var(--cr)}
.pedido b{display:block;font-size:15px;margin-top:6px;line-height:1.3}
.pedido .onde{display:block;font-size:13.5px;color:var(--texto-2)}
.pedido .quem{display:block;font-size:13px;color:var(--texto-3);margin-top:6px}
.pedido .tags{margin-top:8px}
.contestado{font-size:12px;font-weight:700;color:var(--at);background:var(--at-bg);border-radius:6px;padding:1px 7px}
.painel-lado{position:fixed;top:64px;right:0;bottom:0;width:520px;background:var(--cartao);box-shadow:var(--sombra-2);z-index:15;display:flex;flex-direction:column;border-left:1px solid var(--borda)}
.painel-lado .cab-p{padding:18px 22px 14px;border-bottom:1px solid var(--borda)}
.painel-lado .cab-p .l1{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--texto-3)}
.painel-lado h2{margin:6px 0 2px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.painel-lado .corpo-p{flex:1;overflow:auto;padding:4px 22px 18px}
.painel-lado section{padding:14px 0;border-bottom:1px solid var(--borda)}
.painel-lado section:last-child{border-bottom:0}
.painel-lado h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.painel-lado h3 small{font-weight:400;color:var(--texto-3);font-size:13px}
.painel-lado dl{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:14px}
.painel-lado dt{color:var(--texto-3)}.painel-lado dd{margin:0}
.painel-lado .rod-p{padding:14px 22px;border-top:1px solid var(--borda);display:flex;gap:10px;background:var(--cartao-2)}
.painel-lado .rod-p .btn{flex:1}
.dois-campos{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px}
.botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.veu{position:fixed;inset:64px 0 0 0;background:rgba(14,23,38,.18);z-index:14}

/* dossiê da venda */
.dossie-cab{padding:20px 24px;margin-bottom:18px}
.dossie-cab .l0{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--texto-3)}
.dossie-cab h1{margin:6px 0 4px;font-size:30px;font-weight:700;letter-spacing:-.02em}
.dossie-cab .meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14.5px;color:var(--texto-3)}
.dossie-cab .meta b{color:var(--texto-2);font-weight:600}
.dossie-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.processo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-top:20px;padding-top:18px;border-top:1px solid var(--borda)}
.passo{position:relative;padding-right:10px}
.passo::before{content:"";position:absolute;top:12px;left:28px;right:4px;height:3px;border-radius:2px;background:var(--borda)}
.passo:last-child::before{display:none}
.passo.feito::before{background:var(--ok)}
.passo .pt{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--cartao);border:2px solid var(--borda-2);color:var(--texto-3);position:relative;z-index:1}
.passo.feito .pt{background:var(--ok);border-color:var(--ok);color:#fff}
.passo.agora .pt{border-color:var(--in);color:var(--in);box-shadow:0 0 0 4px var(--in-bg)}
.passo.prop-p .pt{border-style:dashed}
.passo b{display:block;font-size:14px;margin-top:8px;line-height:1.3}
.passo small{display:block;font-size:13px;color:var(--texto-3);line-height:1.35}
.duas{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.compor{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--borda)}
.compor input{flex:1;height:40px;border:1px solid var(--borda-2);border-radius:9px;padding:0 12px;background:var(--cartao)}
.filtro-feed{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
.feed{list-style:none;margin:0;padding:8px 20px 16px}
.feed li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--borda)}
.feed li:last-child{border-bottom:0}
.feed .ic{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.ic.rota{background:var(--in-bg);color:var(--in)}.ic.confirmacao{background:var(--ok-bg);color:var(--ok)}.ic.status{background:var(--cartao-3);color:var(--texto-2)}.ic.externa,.ic.viab{background:var(--at-bg);color:var(--at)}.ic.obs{background:var(--marca-bg);color:var(--marca-2)}
.feed b{font-weight:600}
.feed .quando{display:block;font-size:13px;color:var(--texto-3);margin-top:2px}
.ficha-sec{padding:14px 20px;border-top:1px solid var(--borda)}
.ficha-sec:first-of-type{border-top:0}
.ficha-sec h3{margin:0 0 10px;font-size:14.5px}
.ficha-sec dl{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 12px;font-size:14px}
.ficha-sec dt{color:var(--texto-3)}.ficha-sec dd{margin:0;overflow-wrap:anywhere}
.prods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prods li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.prods li span{color:var(--texto-3)}

.vazio{border:2px dashed var(--borda-2);border-radius:var(--raio);padding:48px;text-align:center;color:var(--texto-3)}

/* barra de controle do protótipo */
.prev{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:6px;background:#111317;color:#e8e9eb;border-radius:999px;padding:6px 8px 6px 14px;box-shadow:0 14px 40px rgba(0,0,0,.35);font:500 12.5px/1 system-ui,sans-serif;max-width:calc(100vw - 24px);overflow-x:auto}
.prev b{font-weight:600;white-space:nowrap;margin-right:6px;color:#fff}
.prev button{border:0;background:none;color:#c9ccd1;padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;font:inherit}
.prev button:hover{background:#262a31;color:#fff}
.prev button.on{background:#fff;color:#111317}
.prev .sep{width:1px;height:18px;background:#33373e;margin:0 4px}
.prev .demo{color:#f0b24a;white-space:nowrap;padding:0 6px}

@media (max-width:1280px){
  .modulos a{padding:0 9px;font-size:14px}.busca-b{flex-basis:200px}.eu div{display:none}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g-3-1,.duas,.com-gaveta{grid-template-columns:1fr}.faixa-meta{grid-template-columns:1fr}.faixa-meta>div+div{border-left:0;border-top:1px solid var(--borda)}
  .fases{grid-template-columns:1fr}.processo{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:18px}
}
/* telas médias: com o menu aberto, o logo volta para o topo claro e sobra espaço para as abas dos módulos */
@media (min-width:901px) and (max-width:1180px){
  body:not(.recolhido) .marca-b{width:auto;margin-left:0;padding-left:0;background:none;box-shadow:none;border-right:0}
  body:not(.recolhido) .marca-b .logo.c{display:block}body:not(.recolhido) .marca-b .logo.e{display:none}
}
@media (max-width:1100px){.busca-b{flex:none;width:38px;min-width:0;padding:0;justify-content:center}.busca-b span,.busca-b kbd{display:none}}
@media (min-width:901px) and (max-width:980px){.pres .pilha{display:none}.pres{padding:4px 10px}}
.menu-b{display:none}
.mods-cel{display:none}
@media (max-width:900px){
  .menu-b{display:inline-flex}
  .lateral{display:flex!important;position:fixed;left:0;top:64px;bottom:0;width:300px;transform:translateX(-100%);transition:transform .2s;z-index:40;box-shadow:var(--sombra-2)}
  body.gaveta .lateral{transform:none}
  .mods-cel{display:flex;flex-direction:column;gap:2px;padding:0 0 12px;margin-bottom:8px;border-bottom:1px solid var(--lat-linha)}
  .lateral .fim{display:none}
  /* topo estreito: o logo volta para o fundo do topo (a gaveta continua azul-marinho) */
  .marca-b{width:auto;margin-left:0;padding-left:0;background:none;box-shadow:none;border-right:0}
  .marca-b .logo.c{display:block}.marca-b .logo.e{display:none}
  .mods-cel a{font-weight:600}
  .eu div{display:none}
  .casca{grid-template-columns:1fr}.lateral{display:none}.modulos{display:none}.busca-b{display:none}.area{padding:18px 16px 100px}
  .classes,.quadro{grid-template-columns:1fr}.painel-lado{width:100%}
}
@media (max-width:760px){
  .topo{padding:0 12px;gap:10px}.topo .logo{height:22px}.pres{padding:3px}.pres .pilha span:nth-child(n+2){display:none}.pres{font-size:0}.pres .pilha span{font-size:10.5px}
  .cab{flex-direction:column;align-items:stretch}.cab h1{font-size:24px}
  .g5{grid-template-columns:repeat(2,minmax(0,1fr))}.grande{font-size:38px}
  .fase .tiles,.fase:first-child .tiles,.fase:last-child .tiles{grid-template-columns:1fr}
  .visoes{overflow-x:auto;scrollbar-width:none}
  .barra-filtros .buscar{width:100%;margin-left:0}
  .com-gaveta{grid-template-columns:1fr}.gaveta{position:static}
  .processo{grid-template-columns:repeat(2,minmax(0,1fr))}.passo::before{display:none}
  .dois-campos{grid-template-columns:1fr}.painel-lado dl{grid-template-columns:1fr}
  .equipes{grid-template-columns:1fr}
  /* tabelas: linhas empilhadas, rótulo à esquerda e valor à direita (a página nunca rola para os lados) */
  .tabela,.tabela tbody,.tabela tr,.tabela td{display:block;width:100%}
  .tabela thead{display:none}
  .tabela tr{padding:12px 16px;border-bottom:1px solid var(--borda)}
  .tabela td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0;border:0;text-align:right;min-width:0!important}
  .tabela td::before{content:attr(data-l);color:var(--texto-3);font-size:13px;text-align:left;flex:none}
  .tabela td:first-child{display:block;text-align:left;padding-bottom:6px}.tabela td:first-child::before{display:none}
  .com-gaveta .tabela td:first-child{min-width:0}
}
</style>
</head>
<body>
<header class="topo">
  <button class="ib menu-b" id="menu-b" aria-label="Abrir o menu" aria-expanded="false">☰</button>
  <div class="marca-b"><img class="logo c" src="assets/logo.png" alt="Seven Telecom"><img class="logo e" src="assets/logo_escuro.png" alt="Seven Telecom"><img class="logo i" src="assets/icone-192.png" alt="Seven Telecom"></div>
  <nav class="modulos" id="modulos" aria-label="Módulos"></nav>
  <div class="dir">

    <button class="pres" title="Quem está online"><span class="pilha"><span style="background:#2a64ad">JC</span><span style="background:#0f7b46">PH</span><span style="background:#91560b">CM</span></span>23 online</button>

    <button class="eu" title="Conta: perfil, notificações, senha e sair" style="border:0;background:none;cursor:pointer;text-align:left"><span class="av">VR</span><div><b>Vinícius Ribeiro</b><small>Gerente</small></div></button>
  </div>
</header>
<div class="casca">
  <aside class="lateral" id="lateral" aria-label="Páginas do módulo"></aside>

</div>

</nav>

      <section><h3>Resposta do endereço <small>vale para a venda inteira</small></h3>
        <div class="dois-campos"><div class="campo"><label for="hp">HP <small>obrigatório para atender</small></label><input id="hp" inputmode="numeric"></div><div class="campo"><label for="rv">Resposta ao vendedor <small>obrigatória se não atender</small></label><input id="rv" placeholder="Ex.: fora da área de cobertura"></div></div>

const TELAS = { painel: telaPainel, vendas: telaVendas, equipes: telaEquipes, viabilidade: telaViabilidade, venda: telaVenda };
function ir(pg) {
  if (pg === "app") { location.href = "direcao-b-app.html"; return; }
  pintarNavegacao(pg);
  const alvo = document.getElementById("tela"), f = TELAS[pg];
  alvo.innerHTML = f ? f() : `<div class="cab"><div><div class="mig">${moduloDe(pg).n}</div><h1>${nomeDe(pg) || "Página"}</h1></div></div><div class="vazio">Esta página não faz parte da prévia. Ela mantém o conteúdo atual, com o novo padrão visual aplicado na implementação.</div>`;
  if (pg === "painel") G.acumulado(document.getElementById("g-acum"), { dias: D.dias, meta: D.empresa.meta, altura: 280 });
  G.ligarBullets(alvo); G.rotularTabelas(alvo);
  document.querySelectorAll(".prev [data-ir]").forEach((b) => b.classList.toggle("on", b.dataset.ir === pg));
  window.scrollTo(0, 0);
  history.replaceState(null, "", "#" + pg);
}
document.addEventListener("click", (ev) => {
  const am = document.getElementById("acao-mod");
  if (am && ev.target.closest("#acao-b")) { const ab = am.classList.toggle("aberto"); document.getElementById("acao-b").setAttribute("aria-expanded", ab); return; }
  if (am && !ev.target.closest("#acao-mod")) am.classList.remove("aberto");
  const a = ev.target.closest("[data-ir]"); if (!a) return; ev.preventDefault(); ir(a.dataset.ir);
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") document.getElementById("acao-mod")?.classList.remove("aberto"); });
ir((location.hash || "#painel").slice(1));
</script>
