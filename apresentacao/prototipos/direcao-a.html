<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direção A · Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DIREÇÃO A · CONTROLE
   Mesa de trabalho precisa: hierarquia pela tipografia e por réguas, quase sem cor.
   Navegação em dois níveis lado a lado (módulos no trilho, páginas no painel de contexto).
   ===================================================================== */
:root{
  color-scheme:light;
  --canvas:#f4f4f2; --surface:#ffffff; --surface-2:#fafaf8; --surface-3:#f1f0ed;
  --line:#e4e3df; --line-2:#d2d0ca;
  --ink:#17191c; --ink-2:#4a4f57; --ink-3:#6f747c;
  --brand:#c9202e; --brand-ink:#a3161f; --brand-wash:#fbedee;
  --ok:#17703f; --ok-mark:#2e9e5b; --ok-wash:#eaf5ee;
  --warn:#8a5600; --warn-mark:#d4900f; --warn-wash:#fbf3e2;
  --crit:#b3261e; --crit-mark:#d0393b; --crit-wash:#fbecea;
  --info:#245fa8; --info-wash:#eaf1fa;
  --g-real:#2a64ad; --g-proj:#a9c4e8; --g-meta:#17191c; --g-grade:#ecebe7; --g-eixo:#cfcdc7;
  --st-inst:#2e9e5b; --st-pend:#6f8fbf; --st-canc:#d0393b;
  /* lateral (trilho + painel de páginas): o azul-marinho do sistema atual (ui.css --menu-bg), mantido a pedido do cliente */
  --nav:#0c1322; --nav-2:#131c2e; --nav-linha:rgba(255,255,255,.08);
  --nav-tx:#aab4c5; --nav-tx-2:#8794a8; --nav-forte:#ffffff;
  --nav-hov:rgba(255,255,255,.06); --nav-on:rgba(255,255,255,.1); --nav-destaque:#ff6b77;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px; --foco:0 0 0 2px var(--surface),0 0 0 4px var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss02"}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:0;box-shadow:var(--foco);border-radius:var(--r)}
.mono{font-family:var(--mono);font-size:.93em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------------- casca: trilho de módulos + painel de contexto + área de trabalho ---------------- */
.casca{display:grid;grid-template-columns:76px 232px minmax(0,1fr);min-height:100vh}
body.recolhido .casca{grid-template-columns:76px 0 minmax(0,1fr)}
.trilho{position:sticky;top:0;height:100vh;background:var(--nav);border-right:1px solid var(--nav-linha);display:flex;flex-direction:column;align-items:stretch;padding:12px 8px;gap:4px;z-index:5}
.trilho .marca{display:flex;justify-content:center;padding:4px 0 14px;margin-bottom:6px;border-bottom:1px solid var(--nav-linha)}
.trilho .marca img{width:34px;height:34px}
.trilho a,.trilho button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;border-radius:var(--r);color:var(--nav-tx);font-size:12px;font-weight:500;line-height:1.15;text-align:center;border:0;background:none;cursor:pointer;position:relative}
.trilho svg{width:21px;height:21px}
.trilho a:hover,.trilho button:hover{background:var(--nav-hov);color:var(--nav-forte)}
.trilho a.on{color:var(--nav-forte);background:var(--nav-on);font-weight:600}
.trilho a.on svg{color:var(--nav-destaque)}
.trilho a.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--brand)}
.trilho .fim{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.trilho .av{width:34px;height:34px;border-radius:50%;background:var(--nav-on);border:1px solid rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--nav-forte)}
.trilho :focus-visible,.contexto :focus-visible{box-shadow:inset 0 0 0 2px var(--nav-forte)}
/* sobrevoo do modo recolhido: as páginas do módulo aparecem ao passar o mouse ou focar */
.voo{display:none;position:absolute;left:68px;top:0;min-width:230px;background:var(--nav-2);border:1px solid var(--nav-linha);border-radius:8px;box-shadow:0 14px 36px rgba(0,0,0,.35);padding:8px;text-align:left;z-index:20}
body.recolhido .trilho .item:hover .voo,body.recolhido .trilho .item:focus-within .voo{display:block}
.voo b{display:block;font-size:12px;color:var(--nav-tx-2);font-weight:600;padding:6px 10px 4px}
.voo a{flex-direction:row;justify-content:space-between;align-items:center;font-size:14px;color:var(--nav-tx);padding:7px 10px;text-align:left}
.trilho .item{position:relative}

.contexto{position:sticky;top:0;height:100vh;overflow:auto;background:var(--nav);border-right:1px solid var(--nav-linha);padding:18px 12px 16px;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
body.recolhido .contexto{visibility:hidden;padding:0;border:0}
.contexto h2{font-size:17px;font-weight:600;margin:2px 10px 14px;letter-spacing:-.01em;color:var(--nav-forte)}
.contexto .grp{font-size:12px;font-weight:600;color:var(--nav-tx-2);margin:16px 10px 6px}
.contexto .grp:first-of-type{margin-top:4px}
.contexto a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:var(--r);color:var(--nav-tx);font-size:14px;position:relative}
.contexto a:hover{background:var(--nav-hov);color:var(--nav-forte)}
.contexto a.on{background:var(--nav-on);color:var(--nav-forte);font-weight:600}
.contexto a .cont{font-family:var(--mono);font-size:12.5px;color:var(--nav-tx-2);font-weight:400}
.contexto a.on .cont{color:var(--nav-tx)}
.contexto a .cont.alerta{color:var(--nav-destaque)}
.contexto .rodape{margin-top:auto;padding-top:14px;border-top:1px solid var(--nav-linha)}
.contexto .rodape button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 10px;border-radius:var(--r);color:var(--nav-tx-2);cursor:pointer;font-size:13px}
.contexto .rodape button:hover{background:var(--nav-hov);color:var(--nav-forte)}
.trilho .expandir{display:none}
body.recolhido .trilho .expandir{display:flex}

.trabalho{min-width:0;display:flex;flex-direction:column}
.barra{position:sticky;top:0;z-index:4;height:56px;display:flex;align-items:center;gap:14px;padding:0 28px;background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.trilha{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trilha b{color:var(--ink);font-weight:600}
.trilha i{font-style:normal;color:var(--line-2)}
.barra .busca{margin-left:auto;position:relative;width:min(340px,34vw)}
.barra .busca input{width:100%;height:36px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:0 12px 0 34px;font-size:13.5px}
.barra .busca svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--ink-3)}
.barra .busca kbd{position:absolute;right:8px;top:8px;font:500 11px var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
.online{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer}
.online .pts{display:flex}.online .pts span{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;background:var(--surface-3);font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.online .pts span:first-child{margin-left:0}
.online .ponto{width:8px;height:8px;border-radius:50%;background:var(--ok-mark)}
.icone-btn{width:36px;height:36px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer}
.icone-btn svg{width:18px;height:18px}
.icone-btn:hover{color:var(--ink);border-color:var(--line-2)}
.conteudo{padding:26px 32px 64px;max-width:1320px;width:100%}

/* ---------------- cabeçalho de página ---------------- */
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.cab h1{font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:0}
.cab .linha{font-size:13.5px;color:var(--ink-3);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.cab .linha b{color:var(--ink-2);font-weight:500}
.cab .acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------------- botões e campos ---------------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.leve{border-color:transparent;background:none;color:var(--ink-2)}
.btn.leve:hover{background:var(--surface-3);color:var(--ink)}
.btn.perigo{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,var(--line-2))}
.btn.pq{height:30px;padding:0 10px;font-size:13px}
.dividido{display:inline-flex}.dividido .btn:first-child{border-radius:var(--r) 0 0 var(--r)}.dividido .btn+.btn{border-radius:0 var(--r) var(--r) 0;border-left:1px solid rgba(255,255,255,.35);padding:0 9px}
.menu-acao{position:relative}
.menu-acao .pop{display:none;position:absolute;right:0;top:42px;width:290px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 14px 36px rgba(0,0,0,.14);padding:6px;z-index:10}
.menu-acao.aberto .pop{display:block}
.pop a{display:block;padding:9px 10px;border-radius:var(--r)}
.pop a:hover{background:var(--surface-3)}
.pop a b{display:block;font-weight:500;font-size:14px}
.pop a small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35;margin-top:1px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo>label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.campo input,.campo select{height:36px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 10px;font-size:14px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:4px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:4px}
.seg button.on{background:var(--ink);color:var(--surface)}.seg button.on .n{color:var(--surface);opacity:.75}

/* ---------------- seções do painel (réguas, não cartões) ---------------- */
.secao{border-top:1px solid var(--line-2);padding:20px 0 28px}
.secao>header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.secao h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.secao h2 small{display:block;font-size:13px;font-weight:400;color:var(--ink-3);margin-top:3px;letter-spacing:0}
.secao header a.ver{font-size:13.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.secao header a.ver:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.livro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px}
.livro>div{padding:16px 18px 18px;min-width:0}
.livro>div+div{border-left:1px solid var(--line)}
.rot{font-size:13px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.rot .def{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:help;font-weight:600}
.val{font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1.15;margin:8px 0 4px}
.val small{font-size:15px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.det{font-size:13px;color:var(--ink-3);line-height:1.45}
.det b{color:var(--ink-2);font-weight:500}
.medidor{position:relative;height:8px;background:var(--surface-3);border-radius:2px;margin-top:12px}
.medidor i{position:absolute;left:0;top:0;bottom:0;background:var(--g-real);border-radius:2px}
.medidor u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.medidor-leg{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:8px}
.g-pilha{display:flex;gap:2px;height:10px;margin-top:14px}
.g-pilha-p{display:block;border-radius:2px;min-width:3px}
.g-pilha-p.inst{background:var(--st-inst)}.g-pilha-p.pend{background:var(--st-pend)}.g-pilha-p.canc{background:var(--st-canc)}
.leg-est{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;font-size:13px;margin-top:10px;color:var(--ink-2);align-items:center}
.leg-est i{width:10px;height:10px;border-radius:2px;display:inline-block}
.leg-est .num{color:var(--ink);font-weight:500;text-align:right}

.meta-grade{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.proj-box .val{font-size:44px}
.proj-box dl{margin:18px 0 0;display:grid;grid-template-columns:1fr auto;gap:10px 16px;font-size:13.5px}
.proj-box dt{color:var(--ink-2)}
.proj-box dd{margin:0;text-align:right;font-weight:600}
.proj-box dd small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.metodo{margin-top:16px;font-size:12.5px;color:var(--ink-3);line-height:1.5;border-left:2px solid var(--line-2);padding-left:10px}
.grafico{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 10px 6px}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);padding:0 8px 6px}
.legenda span{display:inline-flex;align-items:center;gap:7px}
.chv{display:inline-block;width:18px;height:0;border-top:2px solid var(--g-real)}
.chv.proj{border-top:2px dashed var(--g-proj)}
.chv.meta{border-top:1px solid var(--g-meta)}
.chv.barra{height:10px;width:14px;border:0;background:var(--g-real);border-radius:2px}
.chv.barra.proj{background:var(--g-proj)}
.chv.tick{width:2px;height:12px;border:0;background:var(--g-meta)}

/* gráfico de linha (SVG) */
.g-svg{width:100%;height:auto;display:block;overflow:visible}
.g-grade{stroke:var(--g-grade);stroke-width:1}
.g-base{stroke:var(--g-eixo);stroke-width:1}
.g-tick{fill:var(--ink-3);font-size:11.5px;font-family:var(--sans)}
.g-meta{stroke:var(--g-meta);stroke-width:1.2}
.g-rot-meta{fill:var(--ink);font-size:12px;font-weight:600}
.g-hoje{stroke:var(--line-2);stroke-width:1}
.g-real{fill:none;stroke:var(--g-real);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.g-real-area{fill:var(--g-real);opacity:.08}
.g-proj{fill:none;stroke:var(--g-real);stroke-opacity:.55;stroke-width:2;stroke-dasharray:5 5;stroke-linecap:round}
.g-pt-real{fill:var(--g-real);stroke:var(--surface);stroke-width:2}
.g-pt-proj{fill:var(--surface);stroke:var(--g-real);stroke-width:2}
.g-rot-fim{fill:var(--ink);font-size:13px;font-weight:600}
.g-cruz{stroke:var(--ink-3);stroke-width:1}
.g-capa{cursor:crosshair}.g-capa:focus{outline:none}
.g-dica{position:fixed;display:none;z-index:50;min-width:190px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.14);padding:9px 11px;font-size:12.5px;pointer-events:none}
.g-dica-t{font-weight:600;color:var(--ink);margin-bottom:6px}
.g-dica-l{display:grid;grid-template-columns:16px auto 1fr;gap:8px;align-items:center;color:var(--ink-3);line-height:1.6}
.g-dica-l b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.g-chave{display:block;width:14px;border-top:2px solid var(--k)}
.g-chave.tracejada{border-top-style:dashed}.g-chave.regua{border-top-width:1px}.g-chave.fina{opacity:.45}

/* barras de meta por equipe */
.g-bullet{position:relative;height:18px;border-radius:2px;background:var(--surface-3);cursor:default}
.g-bullet .g-b-proj{position:absolute;left:0;top:4px;bottom:4px;background:var(--g-proj);border-radius:0 2px 2px 0}
.g-bullet .g-b-real{position:absolute;left:0;top:4px;bottom:4px;background:var(--g-real);border-radius:0 2px 2px 0}
.g-bullet .g-b-meta{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--g-meta)}
.g-bullet:focus-visible{box-shadow:var(--foco)}

/* ---------------- tabelas ---------------- */
.tabela{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabela th{font-size:12.5px;font-weight:500;color:var(--ink-3);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tabela td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabela tr:last-child td{border-bottom:0}
.tabela tbody tr:hover td{background:var(--surface-2)}
.tabela .n,.tabela th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabela td.n b{font-weight:600}
.tabela .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.tabela tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line-2)}
.tabela .larga{width:30%;min-width:200px}
.tabela.equipes th:first-child,.tabela.equipes td:first-child{min-width:230px}
.tabela tr.link{cursor:pointer}
.tabela tr.on td{background:var(--info-wash)}
.prop{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--info);border:1px dashed color-mix(in srgb,var(--info) 60%,transparent);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle;white-space:nowrap}

/* situação: sempre texto + ícone (a cor nunca carrega o sentido sozinha) */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st.ok{color:var(--ok)}.st.atencao{color:var(--warn)}.st.abaixo{color:var(--crit)}
.st.atencao::before{border-radius:1px;transform:rotate(45deg);width:7px;height:7px}
.st.abaixo::before{border-radius:0;width:0;height:0;background:none;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid currentColor}
.st.inst{color:var(--ok)}.st.pend{color:var(--info)}.st.canc{color:var(--crit)}
.st.pend::before{background:none;border:2px solid currentColor;width:6px;height:6px}
.st.canc::before{border-radius:1px}
.st.neutro{color:var(--ink-2)}.st.neutro::before{background:var(--ink-3)}

/* ---------------- desvios ---------------- */
.desvios{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.desvio{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.desvio:first-child{border-top:0}
.desvio .ic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.desvio .ic.abaixo{background:var(--crit-wash);color:var(--crit)}.desvio .ic.atencao{background:var(--warn-wash);color:var(--warn)}
.desvio b{display:block;font-weight:600;font-size:14.5px}
.desvio p{margin:3px 0 0;color:var(--ink-2);font-size:13.5px}
.desvio .base{display:block;margin-top:5px;font-size:12.5px;color:var(--ink-3)}
.desvio .btn{align-self:center}

/* ---------------- filtros e listas ---------------- */
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:0}
.ativos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--surface-2);border:1px solid var(--line);border-bottom:0;font-size:13px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:2px 6px 2px 10px;font-size:12.5px;color:var(--ink)}
.chip button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.tabela.colada{border-radius:0 0 8px 8px}
.rodape-tab{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;color:var(--ink-3);font-size:13px}
.prods{display:flex;gap:4px;flex-wrap:wrap}
.prods span{font-size:12px;border:1px solid var(--line-2);border-radius:4px;padding:0 6px;color:var(--ink-2);white-space:nowrap;background:var(--surface-2)}

.placeholder{border:1px dashed var(--line-2);border-radius:8px;padding:40px;text-align:center;color:var(--ink-3)}

/* ---------------- fila: lista + painel do pedido ---------------- */
.fila{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);border:1px solid var(--line);border-radius:0 0 8px 8px;background:var(--surface);min-height:640px}
.fila-lista{border-right:1px solid var(--line);overflow:auto;max-height:780px}
.fila-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px 13px;cursor:pointer;position:relative}
.fila-item:hover{background:var(--surface-2)}
.fila-item.on{background:var(--info-wash)}
.fila-item.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink)}
.fila-item .l1{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.fila-item .idade{font-weight:600;color:var(--ink-2)}
.fila-item .idade.fora{color:var(--crit)}
.fila-item .l1 .mono{margin-left:auto}
.fila-item .end{display:block;font-weight:600;font-size:14px;margin-top:5px;line-height:1.35}
.fila-item .onde{display:block;font-size:13px;color:var(--ink-2)}
.fila-item .quem{display:block;font-size:12.5px;color:var(--ink-3);margin-top:5px}
.checas{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.checas span{font-size:11.5px;border:1px solid var(--line-2);border-radius:4px;padding:0 6px;color:var(--ink-2);background:var(--surface)}
.marca-cont{font-size:11.5px;font-weight:600;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:4px;padding:0 6px}
.fila-det{padding:20px 24px 28px;min-width:0}
.det-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.det-cab h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.det-cab .linha{font-size:13px;color:var(--ink-3);margin-top:4px}
.det-cab .linha b{color:var(--ink-2);font-weight:500}
.bloco{padding:16px 0;border-bottom:1px solid var(--line)}
.bloco:last-child{border-bottom:0}
.bloco h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bloco h3 small{font-size:12.5px;font-weight:400;color:var(--ink-3)}
.dados{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 20px;margin:0}
.dados dt{font-size:12.5px;color:var(--ink-3)}
.dados dd{margin:2px 0 0;font-size:14px;color:var(--ink)}
.resposta{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;margin-top:4px}
.resposta textarea{min-height:64px;resize:vertical;border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.campo .ajuda{font-size:12px;color:var(--ink-3)}
.botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn.sim{border-color:color-mix(in srgb,var(--ok) 45%,var(--line-2));color:var(--ok)}
.btn.nao{border-color:color-mix(in srgb,var(--crit) 40%,var(--line-2));color:var(--crit)}
.btn.sim:hover{background:var(--ok-wash)}.btn.nao:hover{background:var(--crit-wash)}
.aviso-linha{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
.conversa{display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;font-size:13.5px}
.msg div{background:var(--surface-3);border-radius:8px;padding:8px 11px}
.msg small{display:block;color:var(--ink-3);font-size:12px;margin-top:3px}
.msg.eu{align-self:flex-end}.msg.eu div{background:var(--info-wash)}
.anexos{display:flex;gap:8px;flex-wrap:wrap}
.anexo{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:13px;background:var(--surface-2)}
.anexo i{width:28px;height:28px;border-radius:4px;background:linear-gradient(135deg,#c9d3df,#9aa8b8);display:inline-block}
.inst-cel{font-size:13px;white-space:nowrap}
.inst-cel.alerta{color:var(--warn);font-weight:500}.inst-cel.atrasada{color:var(--crit);font-weight:500}
.pag{display:flex;gap:4px}.pag button{min-width:32px;height:30px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);cursor:pointer;font-size:13px}.pag button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------------- detalhe da venda ---------------- */
.ficha-cab{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--line-2);margin-bottom:22px}
.ficha-cab .sobre{font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.ficha-cab h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:4px 0 0}
.ficha-cab .linha{font-size:13.5px;color:var(--ink-3);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.ficha-cab .linha b{color:var(--ink-2);font-weight:500}
.ficha-st{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.st-grande{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--info-wash);color:var(--info)}
.st-grande::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid currentColor}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.cartao>h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cartao>h3 small{font-weight:400;color:var(--ink-3);font-size:12.5px}
.cartao .corpo{padding:14px 16px}
.proximo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid color-mix(in srgb,var(--info) 30%,var(--line));background:var(--info-wash);border-radius:8px;margin-bottom:18px}
.proximo .ic{width:34px;height:34px;border-radius:8px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--info)}
.proximo b{display:block;font-size:15px}.proximo span{font-size:13px;color:var(--ink-2)}
.etapas{list-style:none;margin:0;padding:6px 16px 10px}
.etapas li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 0;align-items:start;position:relative}
.etapas li::after{content:"";position:absolute;left:10px;top:30px;bottom:-8px;width:2px;background:var(--line)}
.etapas li:last-child::after{display:none}
.etapas .pt{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--line-2);background:var(--surface);color:var(--ink-3);z-index:1}
.etapas .feito .pt{background:var(--ok);border-color:var(--ok);color:#fff}
.etapas .agora .pt{border-color:var(--info);color:var(--info)}
.etapas b{font-weight:600;font-size:14px}.etapas span{display:block;font-size:13px;color:var(--ink-3)}
.etapas time{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.etapas .prop-et{opacity:.85}.etapas .prop-et .pt{border-style:dashed}
.etapas .prop{display:inline-flex}
.lado dl{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.lado dt{color:var(--ink-3)}.lado dd{margin:0;overflow-wrap:anywhere}
.linha-tempo{list-style:none;margin:0;padding:4px 16px 12px}
.linha-tempo li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.linha-tempo li:last-child{border-bottom:0}
.linha-tempo time{color:var(--ink-3);font-size:12.5px;font-family:var(--mono)}
.linha-tempo small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.linha-tempo .tipo{font-size:11.5px;font-weight:600;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;margin-right:6px}
.tab-prod{width:100%;border-collapse:collapse;font-size:13.5px}
.tab-prod td{padding:8px 0;border-bottom:1px solid var(--line)}
.tab-prod tr:last-child td{border-bottom:0}
.tab-prod td.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------------- barra de controle do protótipo (não faz parte do produto) ---------------- */
.prev{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:6px;background:#111317;color:#e8e9eb;border-radius:999px;padding:6px 8px 6px 14px;box-shadow:0 14px 40px rgba(0,0,0,.35);font:500 12.5px/1 system-ui,sans-serif;max-width:calc(100vw - 24px);overflow-x:auto}
.prev b{font-weight:600;white-space:nowrap;margin-right:6px;color:#fff}
.prev button{border:0;background:none;color:#c9ccd1;padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;font:inherit}
.prev button:hover{background:#262a31;color:#fff}
.prev button.on{background:#fff;color:#111317}
.prev .sep{width:1px;height:18px;background:#33373e;margin:0 4px}
.prev .demo{color:#f0b24a;white-space:nowrap;padding:0 6px}

@media (max-width:1180px){
  .casca{grid-template-columns:76px 0 minmax(0,1fr)} .contexto{visibility:hidden;padding:0;border:0}
  .trilho .item:hover .voo,.trilho .item:focus-within .voo{display:block}
  .livro{grid-template-columns:repeat(2,minmax(0,1fr))}.livro>div:nth-child(3){border-left:0;border-top:1px solid var(--line)}.livro>div:nth-child(4){border-top:1px solid var(--line)}
  .meta-grade{grid-template-columns:1fr}
}
@media (max-width:760px){
  .casca{grid-template-columns:minmax(0,1fr)} .trilho{position:fixed;bottom:0;top:auto;height:64px;width:100%;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--nav-linha)}
  .trilho .marca,.trilho .fim{display:none}.trilho>#modulos{display:flex;flex:1;gap:2px;min-width:0}.trilho .item{flex:1;min-width:0}.trilho a{font-size:11px;padding:6px 0}
  .trilho a.on::before{left:14px;right:14px;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .barra{padding:0 16px}.barra .busca{display:none}.conteudo{padding:18px 16px 110px}.livro{grid-template-columns:1fr}.livro>div+div{border-left:0;border-top:1px solid var(--line)}
  .trilho .voo{display:none!important}
  /* páginas do módulo: faixa de atalhos rolável logo abaixo do topo (a página em si nunca rola para os lados) */
  /* aqui o painel de páginas vira faixa de atalhos clara, junto do conteúdo; a barra de módulos embaixo continua azul-marinho */
  .contexto{visibility:visible;position:static;height:auto;grid-row:1;flex-direction:row;align-items:center;gap:6px;overflow-x:auto;padding:10px 16px!important;border:0;border-bottom:1px solid var(--line)!important;scrollbar-width:none;background:var(--surface-2)}
  .contexto h2,.contexto .grp,.contexto .rodape{display:none}
  .contexto a{flex:none;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--ink-2)}
  .contexto a:hover{background:var(--surface-3);color:var(--ink)}
  .contexto a .cont{color:var(--ink-3)}.contexto a .cont.alerta{color:var(--crit)}
  .contexto :focus-visible{box-shadow:var(--foco)}
  .contexto a.on{background:var(--ink);color:var(--surface);box-shadow:none}.contexto a.on .cont{color:var(--surface)}
  .trabalho{grid-row:2}
  .cab{flex-direction:column;align-items:stretch}.cab .acoes{justify-content:flex-start}
  .meta-grade{grid-template-columns:1fr}.fila{grid-template-columns:1fr}.fila-lista{max-height:none;border-right:0}.fila-det{border-top:1px solid var(--line)}
  .resposta{grid-template-columns:1fr}.ficha,.ficha-cab{grid-template-columns:1fr}.ficha-st{align-items:flex-start}
  .filtros>.campo{width:100%!important;min-width:0!important}.filtros .seg{overflow-x:auto;max-width:100%}
  /* tabelas: linhas empilhadas, rótulo à esquerda e valor à direita */
  .tabela,.tabela tbody,.tabela tfoot,.tabela tr,.tabela td{display:block;width:100%}
  .tabela thead{display:none}
  .tabela tr{padding:10px 14px;border-bottom:1px solid var(--line)}
  .tabela td{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border:0;text-align:right;min-width:0!important}
  .tabela td::before{content:attr(data-l);color:var(--ink-3);font-size:12.5px;text-align:left;flex:none}
  .tabela td:first-child{display:block;text-align:left;font-size:15px;padding-bottom:6px}.tabela td:first-child::before{display:none}
  .tabela td:empty{display:none}.tabela td .g-bullet{flex:1;max-width:60%}
}
</style>
</head>
<body>
<div class="casca" id="casca">
  <nav class="trilho" aria-label="Módulos">
    <div class="marca"><img src="assets/icone-192.png" alt="Seven Telecom"></div>

      <button title="Ajuda e manual" aria-label="Ajuda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 014.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17.2v.1"/></svg><span>Ajuda</span></button>

</div>

<script>
"use strict";
const D = window.DEMO, G = window.GRAF, nf = G.nf;
const pct = (x, c = 0) => (x * 100).toFixed(c).replace(".", ",") + "%";
const dec = (x, c = 1) => x.toFixed(c).replace(".", ",");
const ICO = {
  visao: '<rect x="3.5" y="3.5" width="7" height="8" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"/>',
  comercial: '<path d="M4 19h16"/><path d="M7 16V10M12 16V6M17 16v-4"/>',
  operacao: '<path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2"/><circle cx="15" cy="18" r="2"/>',
  gestao: '<circle cx="12" cy="12" r="8.5"/><path d="M12 12V3.5M12 12l6.5 4.5"/>',
  admin: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',
};
/* Arquitetura proposta (a mesma nas duas direções): poucos módulos, páginas agrupadas por tipo de trabalho. */
const MODULOS = [
  { k: "visao", n: "Visão geral", grupos: [["Acompanhamento", [["painel", "Painel"], ["fechamento", "Fechamento do dia"]]]] },
  { k: "comercial", n: "Comercial", grupos: [["Vendas", [["vendas", "Vendas", nf.format(D.empresa.vendas)], ["crm", "CRM · agenda e clientes"]]], ["Equipes e vendedores", [["equipes", "Equipes", "7"], ["semvenda", "Sem venda hoje", String(D.empresa.semVenda)], ["produtividade", "Produtividade por vendedor"]]]] },
  { k: "operacao", n: "Operação", grupos: [["Antes do lançamento", [["viabilidade", "Viabilidade", String(D.viabResumo.pendentes + D.viabResumo.analise)], ["conexao", "Conexão / Solar", "7"]]], ["Depois do lançamento", [["confirmacao", "Confirmação D+1 / D+15", "58"], ["rota", "Rota de instalação", "46"], ["pendencias", "Pendências", "64"]]]] },
  { k: "gestao", n: "Gestão", grupos: [["Análises", [["a-vendas", "Vendas"], ["a-qualidade", "Qualidade (FPD)"], ["a-operacao", "Operação"], ["a-vendedores", "Vendedores"], ["a-geografia", "Geografia"]]], ["Metas e premiação", [["premiacao", "Premiação do mês"], ["plano", "Plano do mês (metas)"]]], ["Financeiro", [["extrato", "Extrato Claro"]]]] },
  { k: "admin", n: "Administração", curto: "Admin.", grupos: [["Cadastros e controle", [["usuarios", "Usuários e equipes"], ["feriados", "Feriados e dias úteis"], ["central", "Central de alterações"], ["online", "Quem está online", "23"]]]] },
];
const moduloDe = (pg) => MODULOS.find((m) => m.grupos.some(([, it]) => it.some(([k]) => k === pg))) || MODULOS[0];
const nomeDe = (pg) => { for (const m of MODULOS) for (const [, it] of m.grupos) for (const [k, n] of it) if (k === pg) return n; return ""; };

function pintarNavegacao(pg) {
  const mod = pg === "venda" ? MODULOS[1] : moduloDe(pg);
  const ativo = pg === "venda" ? "vendas" : pg;
  document.getElementById("modulos").innerHTML = MODULOS.map((m) => `<div class="item"><a href="#" data-ir="${m.grupos[0][1][0][0]}" class="${m === mod ? "on" : ""}" aria-current="${m === mod ? "page" : "false"}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICO[m.k]}</svg><span>${m.curto || m.n}</span></a>

const TELAS = { painel: telaPainel, equipes: telaEquipes, viabilidade: telaViabilidade, vendas: telaVendas, venda: telaVenda };
function ir(pg) {
  if (pg === "app") { location.href = "direcao-a-app.html"; return; }
  const f = TELAS[pg];
  pintarNavegacao(pg);
  const alvo = document.getElementById("tela");
  alvo.innerHTML = f ? f() : `<div class="cab"><div><h1>${nomeDe(pg) || "Página"}</h1></div></div><div class="placeholder">Esta página não faz parte da prévia. Ela mantém o conteúdo atual, com o novo padrão visual aplicado na implementação.</div>`;
  if (pg === "painel") G.acumulado(document.getElementById("g-acum"), { dias: D.dias, meta: D.empresa.meta });
  G.ligarBullets(alvo); G.rotularTabelas(alvo);
  document.querySelectorAll(".prev [data-ir]").forEach((b) => b.classList.toggle("on", b.dataset.ir === pg));
  window.scrollTo(0, 0);
  history.replaceState(null, "", "#" + pg);
}
document.addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-ir]"); if (!a) return;
  ev.preventDefault(); ir(a.dataset.ir);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "/" && document.activeElement.tagName !== "INPUT") { ev.preventDefault(); document.querySelector(".busca input").focus(); }
  if (ev.key === "Escape") document.getElementById("ma")?.classList.remove("aberto");
});
/* menu de lançamento (Nova venda ▾): abre ao clicar, fecha ao clicar fora ou com Esc */
document.addEventListener("click", (ev) => {
  const ma = document.getElementById("ma"); if (!ma) return;
  if (ev.target.closest("#ma-b")) { const ab = ma.classList.toggle("aberto"); ev.target.closest("#ma-b").setAttribute("aria-expanded", ab); return; }
  if (!ev.target.closest("#ma")) ma.classList.remove("aberto");
});
ir((location.hash || "#painel").slice(1));
</script>
