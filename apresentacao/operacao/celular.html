<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/icone-seven-one.png">
<title>Seven One · app no celular (demonstração)</title>
<!-- O app na demonstração, num tamanho de celular. ?perfil=vendedor|lider|coordenador|gestor e ?rota=/meu (tela inicial). Dados fictícios. -->
<style>
html,body{margin:0;min-height:100%}
body{background:#0c1322;color:#c3cad6;font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
.aparelho{border:10px solid #1d2638;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45);width:390px;max-width:100%}
iframe{display:block;border:0;width:100%;height:min(844px,calc(100vh - 100px))}
p{margin:12px 0 0;text-align:center}
a{color:#fff}
</style>
</head>
<body>
<div class="aparelho"><iframe title="App Seven One (demonstração)"></iframe></div>
<p>Dados fictícios · nada é gravado · <a target="_blank" rel="noopener">abrir em tela cheia</a></p>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const PERFIS = ["vendedor", "lider", "coordenador", "gestor", "administrador"];
  const perfil = PERFIS.includes(q.get("perfil")) ? q.get("perfil") : "vendedor";
  const rota = /^\/[a-z-]+$/.test(q.get("rota") || "") ? q.get("rota") : "/meu";
  const url = "../sistema/demo/?perfil=" + perfil + "&app#" + rota;
  if (matchMedia("(max-width: 540px)").matches && window === top) { location.replace(url); return; }
  document.querySelector("iframe").src = url;
  document.querySelector("a").href = url;
})();
</script>
</body>
</html>
